name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint install.sh
        run: shellcheck --severity=warning install.sh

      # manage.sh, monitor.sh и telegram-report.sh генерируются из heredoc'ов
      # внутри install.sh, поэтому линтер их не видит — извлекаем и проверяем.
      - name: Lint generated scripts
        run: |
          mkdir -p /tmp/gen
          awk '/^cat > manage.sh <<.MANAGE_EOF.$/{f=1;next} /^MANAGE_EOF$/{f=0} f' \
            install.sh > /tmp/gen/manage.sh
          awk '/^cat > scripts\/monitor.sh <<.MONITOR_EOF.$/{f=1;next} /^MONITOR_EOF$/{f=0} f' \
            install.sh > /tmp/gen/monitor.sh
          awk '/^cat > scripts\/telegram-report.sh <<.TELEGRAM_EOF.$/{f=1;next} /^TELEGRAM_EOF$/{f=0} f' \
            install.sh > /tmp/gen/telegram-report.sh
          for f in manage.sh monitor.sh telegram-report.sh; do
            test -s "/tmp/gen/$f" || { echo "::error::не удалось извлечь $f"; exit 1; }
            bash -n "/tmp/gen/$f" || exit 1
            echo "$f: синтаксис в порядке"
          done
          # SC1090 — динамический source конфигов, ожидаемо и безопасно.
          shellcheck --severity=warning --exclude=SC1090 /tmp/gen/*.sh

      # `tr < /dev/urandom | head -c N` роняет скрипт с кодом 141: head рвёт
      # пайп, tr получает SIGPIPE, `set -euo pipefail` завершает установку
      # молча. Один раз это уже сломало установщик — держим проверку в CI.
      - name: Guard against SIGPIPE in random generation
        run: |
          # Опасен только бесконечный поток, обрываемый head: сначала
          # отбрасываем строки-комментарии, затем ищем urandom, после которого
          # в том же пайпе стоит head. Безопасная форма `head -c N /dev/urandom`
          # (head идёт ДО urandom и завершается сам) не срабатывает.
          if grep -vE '^[[:space:]]*#' install.sh \
              | grep -nE '/dev/urandom.*\|.*head'; then
            echo "::error::небезопасный пайп urandom→head (SIGPIPE, exit 141)"
            exit 1
          fi
          echo "небезопасных пайпов не найдено"

      # occ под root создаёт файлы в data/ с владельцем root, после чего Apache
      # (www-data) их не читает. Все вызовы обязаны идти через -u www-data.
      - name: Guard against running occ as root
        run: |
          if grep -n 'exec -T nextcloud php occ' install.sh; then
            echo "::error::occ вызывается без -u www-data (файлы станут root-owned)"
            exit 1
          fi
          echo "все occ-вызовы идут через www-data"

      - name: Smoke-test password generation
        run: |
          # Функция должна работать именно под set -euo pipefail.
          eval "$(awk '/^gen_password\(\) \{/{f=1} f{print} f&&/^\}$/{exit}' install.sh)"
          set -euo pipefail
          for n in 24 32 48; do
            pw=$(gen_password "$n")
            test "${#pw}" -eq "$n" \
              || { echo "::error::gen_password $n вернул ${#pw} символов"; exit 1; }
            case "$pw" in
              *[^A-Za-z0-9]*) echo "::error::в пароле есть спецсимволы"; exit 1 ;;
            esac
          done
          echo "gen_password корректна для 24/32/48"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml тоже генерируется установщиком: проверяем, что он
      # валиден и что лимиты/пароли подставляются, а не теряются.
      - name: Validate generated docker-compose.yml
        run: |
          mkdir -p /tmp/compose && cd /tmp/compose
          awk '/^cat > docker-compose.yml <<.EOF.$/{f=1;next} f&&/^EOF$/{exit} f' \
            "$GITHUB_WORKSPACE/install.sh" > docker-compose.yml
          test -s docker-compose.yml || { echo "::error::compose не извлечён"; exit 1; }
          cat > .env <<'ENVEOF'
          DOMAIN=cloud.example.com
          DB_PASSWORD=ci_db_pw
          REDIS_PASSWORD=ci_redis_pw
          ADMIN_PASSWORD=ci_admin_pw
          OVERWRITE_PROTOCOL=https
          OVERWRITE_HOST=cloud.example.com
          NC_URL=https://cloud.example.com
          INSTALL_DIR=/opt/fastcloud
          DB_MEM_LIMIT=512m
          REDIS_MEM_LIMIT=192m
          REDIS_MAXMEMORY=128mb
          NC_MEM_LIMIT=1g
          PHP_MEM=512M
          ENVEOF
          docker compose config > resolved.yml
          echo "compose валиден"
          for svc in db redis nextcloud; do
            grep -q "mem_limit" resolved.yml \
              || { echo "::error::mem_limit потерян"; exit 1; }
          done
          grep -q "maxmemory" resolved.yml \
            || { echo "::error::redis maxmemory не подставлен"; exit 1; }
          grep -q "ci_redis_pw" resolved.yml \
            || { echo "::error::пароли не подставляются"; exit 1; }
          echo "лимиты и подстановка переменных на месте"
